[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "albedo-relight"
version = "0.1.0"
description = "Single-image albedo estimation and controllable relighting"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
# third_party/ 里是原样引入的第三方代码,保持原作者的写法,不做风格检查
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
