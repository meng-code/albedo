# Tool settings only; this repository is not an installable package.
#
# Dependencies for the tests and the laptop-side scripts are listed in the `test` group below and in
# scripts/idarb/requirements-local.txt. In the `mesh` conda environment:
#   pip install -r scripts/idarb/requirements-local.txt
# The server-side environment is described in scripts/idarb/requirements-server.txt.

[dependency-groups]
test = ["numpy<2", "scipy", "pillow", "pytest>=8", "ruff>=0.12"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# the tests import scripts/idarb/normal_to_mesh.py directly
pythonpath = ["scripts/idarb"]

[tool.ruff]
line-length = 100
# scripts/idarb/ also runs in the server's idarb environment (Python 3.8)
target-version = "py38"
# so ruff sorts `import normal_to_mesh` in tests/ as our own module
src = [".", "scripts/idarb"]
# third_party/ 里是原样引入的第三方代码,保持原作者的写法,不做风格检查
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
